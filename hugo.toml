baseURL = "https://www.khatnaps.net/"
languageCode = "en-us"
theme = 'typo'
title = "Kitty corner of the internet"

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "tbd"

# Appearance settings
theme = 'auto'
colorPalette = 'eink'
hideHeader = false

# Intro on main page
homeIntroContent = """
Welcome to my corner <3
"""

# Collection to display on home
homeCollectionTitle = 'Writing'
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = 'January 2006'

# Breadcrumbs
breadcrumbs = false

# Main menu pages
[[params.menu]]
name = "writing"
url = "/"
[[params.menu]]
name = "sketch"
url = "/sketchbooks"
[[params.menu]]
name = "magnets"
url = "/gallery"
[[params.menu]]
name = "today"
url = "/today"
[[params.menu]]
name = "about"
url = "/about"

# Syntax highligth on code blocks
[markup]
[markup.highlight]
style = 'algol'

assetDir = "assets"
