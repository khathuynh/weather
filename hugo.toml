baseURL = "https://www.khatnaps.net/"
languageCode = "en-us"
theme = 'typo'
title = "Kitty corner of the internet"

[module]
  replacements = "wrapper -> wrapper"

  [[module.imports]]
    path = "wrapper"
  [[module.imports]]
    path = "github.com/tomfran/typo"
  [[module.imports]]
    path = "github.com/Sped0n/bridget/v2"

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "tbd"

# Appearance settings
theme = 'auto'
colorPalette = 'eink'
hideHeader = false

# Intro on main page
homeIntroContent = """
Weather forecasting for the soul <3.
"""

# Collection to display on home
homeCollectionTitle = 'Forecasts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = 'January 2006'

# Breadcrumbs
breadcrumbs = false

# Main menu pages
[[params.menu]]
name = "home"
url = "/"
[[params.menu]]
name = "about"
url = "/about"
[[params.menu]]
name = "book"
url = "/book"
[[params.menu]]
name = "map"
url = "/map"

# Syntax highligth on code blocks
[markup]
[markup.highlight]
style = 'algol'
